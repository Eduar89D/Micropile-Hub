name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement tries to create the Pages site. The Actions GITHUB_TOKEN cannot
      # do that (it has no administration:write). If this step fails, an owner must
      # open Settings → Pages → Build and deployment and set Source to GitHub Actions,
      # then re-run this workflow. Deploy still runs so a site that is already enabled
      # will publish.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages enablement result
        run: |
          echo "configure-pages outcome: ${{ steps.pages.outcome }}"
          if [ "${{ steps.pages.outcome }}" != "success" ]; then
            echo "Pages was not enabled by actions/configure-pages."
            echo "Owner steps: Settings → Pages → Build and deployment → Source → GitHub Actions."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
